<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>RPG Arena</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;background:#0f172a;color:#e2e8f0;font-family:system-ui,sans-serif;overflow:hidden;height:100%}
#top{display:flex;align-items:center;gap:8px;padding:6px 10px;background:#1e293b;font-size:13px;font-weight:700}
#plist{display:flex;gap:4px;overflow-x:auto;flex:1}
.chip{background:#334155;border-radius:10px;padding:2px 8px;font-size:11px;white-space:nowrap;cursor:pointer}
#c{display:block;width:100%;height:38vh;background:#14532d;touch-action:none}
#feed{height:44px;overflow:hidden;font-size:11px;padding:2px 8px;color:#fbbf24}
#bars{display:flex;gap:8px;padding:4px 10px;font-size:11px;align-items:center}
.bar{flex:1;height:10px;background:#27272a;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%}
#ctrl{display:flex;gap:8px;padding:4px 10px}
#dpad{display:grid;grid-template-columns:repeat(3,56px);gap:4px}
#dpad button,#acts button{background:#334155;color:#fff;border:1px solid #64748b;border-radius:12px;font-size:20px;padding:10px;font-weight:800}
#acts{display:grid;grid-template-columns:repeat(2,1fr);gap:4px;flex:1}
#acts button{font-size:14px}
button.on{background:#16a34a!important;border-color:#4ade80!important}
button.cd{opacity:.45}
#menu{display:flex;gap:4px;padding:4px 10px;overflow-x:auto}
#menu button{background:#1e293b;color:#e2e8f0;border:1px solid #475569;border-radius:8px;padding:6px 10px;font-size:12px;font-weight:700;white-space:nowrap}
#chatbox{height:52px;overflow-y:auto;font-size:12px;padding:2px 10px;background:#0b1120}
#chatrow{display:flex;gap:4px;padding:4px 10px}
#chatIn{flex:1;background:#1e293b;border:1px solid #475569;border-radius:8px;padding:8px;color:#fff}
#chatSend{background:#f59e0b;border:0;border-radius:8px;padding:8px 12px;font-weight:800}
#join,#popup{position:fixed;inset:0;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;z-index:10}
.card{width:340px;max-width:92vw;background:#1e293b;border:1px solid #64748b;border-radius:14px;padding:16px;text-align:center}
.card h2{margin:0 0 8px}.card p{font-size:12px;color:#94a3b8}
.cls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin:8px 0}
.clsBtn{background:#0f172a;border:2px solid #475569;border-radius:10px;padding:8px 4px;color:#fff;font-size:12px}
.clsBtn.sel{border-color:#f59e0b}
.input{width:100%;background:#0f172a;border:1px solid #475569;border-radius:8px;padding:9px;color:#fff;margin-top:6px}
.primary{width:100%;margin-top:8px;background:#f59e0b;border:0;border-radius:10px;padding:11px;font-weight:800}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="top">RPG ARENA <span id="room"></span><div id="plist"></div></div>
<canvas id="c"></canvas>
<div id="feed"></div>
<div id="bars">
<span>NYAWA</span><div class="bar"><i id="hp" style="background:#22c55e;width:100%"></i></div>
<span>MANA</span><div class="bar"><i id="mp" style="background:#3b82f6;width:100%"></i></div>
<span id="stat">Lv1</span>
</div>
<div id="ctrl">
<div id="dpad">
<span></span><button data-d="0,-1">▲</button><span></span>
<button data-d="-1,0">◀</button><button data-d="0,1">▼</button><button data-d="1,0">▶</button>
</div>
<div id="acts">
<button id="bBasic">BASIC</button><button id="bS1">1</button>
<button id="bS2">2</button><button id="bS3">3</button>
<button id="bLari">LARI</button><button id="bAuto">AUTO:OFF</button>
</div>
</div>
<div id="menu">
<button id="mTas">TAS</button><button id="mChar">KARAKTER</button><button id="mSkill">SKILL</button><button id="mKota">KOTA</button><button id="mHelp">BANTUAN</button>
</div>
<div id="chatbox"></div>
<div id="chatrow"><input id="chatIn" placeholder="chat..." maxlength="60"><button id="chatSend">Kirim</button></div>
<div id="join"><div class="card">
<h2>Masuk RPG Arena</h2>
<p>PvP + monster real-time. Pilih class, satu room 6 pemain.</p>
<div class="cls" id="clsPick">
<button class="clsBtn sel" data-c="warrior"><b>Warrior</b><br><small>Tebas+Dash</small></button>
<button class="clsBtn" data-c="mage"><b>Mage</b><br><small>Api+Frost</small></button>
<button class="clsBtn" data-c="archer"><b>Archer</b><br><small>Panah cepat</small></button>
</div>
<input id="name" class="input" placeholder="Nama kamu">
<input id="roomIn" class="input" placeholder="Kode room (kosong = LOBBY)">
<button id="go" class="primary">MAIN</button>
</div></div>
<div id="popup" class="hidden"><div class="card"><h2 id="pTitle"></h2><div id="pBody" style="font-size:13px"></div><div id="pBtns" style="margin-top:10px;display:flex;gap:6px;justify-content:center"></div></div></div>
<script src="/socket.io/socket.io.js"></script>
<script>
const PTOK='__PTOK__';
const SOCKURL='__RPG_SOCK__';
const store=(function(){
  function ls(){try{if(typeof localStorage==='undefined')return null;localStorage.setItem('__t','1');if(localStorage.getItem('__t')!=='1')return null;localStorage.removeItem('__t');return localStorage;}catch(e){return null;}}
  const L=ls();const mem={};let wn=null;
  try{wn=JSON.parse(window.name||'{}');if(!wn||typeof wn!=='object'||Array.isArray(wn))wn={};}catch(e){wn={};}
  function saveWn(){try{window.name=JSON.stringify(wn);}catch(e){}}
  return{
    get:function(k){try{if(L){const v=L.getItem(k);if(v!==null&&v!==undefined)return v;}}catch(e){} if(wn&&k in wn)return wn[k]; return (k in mem)?mem[k]:null;},
    set:function(k,v){try{if(L){L.setItem(k,v);return;}}catch(e){} try{wn[k]=v;saveWn();}catch(e2){mem[k]=v;}}
  };
})();
const base=(function(){try{if(typeof SOCKURL!=='undefined'&&SOCKURL&&SOCKURL.indexOf('__')!==0)return SOCKURL;if(typeof location!=='undefined'&&location.origin)return location.origin;}catch(e){}return '';})();
const c=document.getElementById('c'),ctx=c.getContext('2d');
let players=new Map(),monsters=[],projs=[],fxs=[],me=null,myCls='warrior',keys={x:0,y:0},lari=false,auto=false,myData=null,world=null,room='LOBBY';
try{room=(new URLSearchParams(location.search).get('room')||'LOBBY').toUpperCase();}catch(e){}
document.getElementById('room').textContent=room;
document.getElementById('roomIn').value=room==='LOBBY'?'':room;
let socket=null;
var FORCEDROOM='__ROOM__';
try{room=(new URLSearchParams(location.search).get('room')||'LOBBY').toUpperCase();}catch(e){}
if(typeof FORCEDROOM!=='undefined'&&FORCEDROOM&&FORCEDROOM.indexOf('__')!==0)room=FORCEDROOM;
function popup(title,html,btns){
  document.getElementById('pTitle').textContent=title;
  document.getElementById('pBody').innerHTML=html;
  const b=document.getElementById('pBtns');b.innerHTML='';
  (btns||[{t:'Tutup',f:hidePopup}]).forEach(function(x){const btn=document.createElement('button');btn.textContent=x.t;btn.className='primary';btn.style.width='auto';btn.onclick=x.f;b.appendChild(btn);});
  document.getElementById('popup').classList.remove('hidden');
}
function hidePopup(){document.getElementById('popup').classList.add('hidden');}
document.querySelectorAll('.clsBtn').forEach(function(b){b.onclick=function(){document.querySelectorAll('.clsBtn').forEach(function(x){x.classList.remove('sel');});b.classList.add('sel');myCls=b.dataset.c;};});
document.getElementById('go').onclick=function(){
  const name=(document.getElementById('name').value.trim()||'Player'+Math.floor(Math.random()*99)).slice(0,12);
  const r=(document.getElementById('roomIn').value.trim().toUpperCase()||'LOBBY').slice(0,8);
  room=r;store.set('rpg_name',name);
  document.getElementById('join').classList.add('hidden');
  connect(name,r);
};
document.getElementById('name').value=store.get('rpg_name')||'';
function connect(name,r){
  socket=io(base+'/rpg',{transports:['websocket','polling']});
  socket.on('joined',function(d){me=d.id;world=d.world;size();});
  socket.on('state',function(d){
    players=new Map(d.players.map(function(p){return [p.id,p];}));
    monsters=d.monsters;projs=d.projs||[];
    myData=players.get(me);
    renderPlist();updateBars();
  });
  socket.on('fx',function(f){f.t=performance.now();fxs.push(f);});
  socket.on('feed',function(m){addFeed(m);});
  socket.on('chat',function(m){addChat(m.name,m.text);});
  socket.on('duelOffer',function(d){popup('Tantangan Duel',d.name+' menantangmu duel!',[ {t:'Terima',f:function(){socket.emit('accept',{from:d.from});hidePopup();}},{t:'Tolak',f:function(){socket.emit('decline',{from:d.from});hidePopup();}}]);});
  socket.on('duelStart',function(d){popup('DUEL DIMULAI',d.a+' vs '+d.b+' — bunuh lawanmu!');setTimeout(hidePopup,2500);});
  socket.on('duelEnd',function(d){popup(d.draw?'DUEL SERI':'PEMENANG',d.draw?'Waktu habis, duel seri.':(d.winner+' menang! +skor WA'));setTimeout(hidePopup,4000);});
  socket.on('errorMsg',function(m){popup('Info',m);});
  socket.emit('join',{name:name,room:r,cls:myCls,token:(typeof PTOK!=='undefined'&&PTOK&&PTOK.indexOf('__')!==0)?PTOK:''});
  setInterval(function(){socket.emit('input',{dx:keys.x,dy:keys.y,lari:lari});},50);
  setInterval(function(){if(auto&&myData&&myData.alive)socket.emit('act',{kind:'basic'});},600);
}
function addFeed(m){const el=document.getElementById('feed');const d=document.createElement('div');d.textContent=m;el.prepend(d);while(el.children.length>3)el.removeChild(el.lastChild);}
function addChat(n,m){const el=document.getElementById('chatbox');const d=document.createElement('div');d.innerHTML='<b>'+n+':</b> '+m.replace(/[<>&]/g,function(c){return {'<':'&lt;','>':'&gt;','&':'&amp;'}[c];});el.appendChild(d);el.scrollTop=el.scrollHeight;}
function renderPlist(){
  const el=document.getElementById('plist');el.innerHTML='';
  players.forEach(function(p){
    const d=document.createElement('span');d.className='chip';d.style.border='1px solid '+p.color;
    d.textContent=p.name+' Lv'+p.level+' '+p.kills+'K';
    if(p.id!==me)d.onclick=function(){if(confirm('Tantang '+p.name+' duel?'))socket.emit('challenge',{to:p.id});};
    el.appendChild(d);
  });
}
function updateBars(){
  if(!myData)return;
  document.getElementById('hp').style.width=(100*myData.hp/myData.maxHp)+'%';
  document.getElementById('mp').style.width=(100*myData.mp/myData.maxMp)+'%';
  document.getElementById('stat').textContent='Lv'+myData.level+' '+myData.kills+'K/'+myData.deaths+'D P:'+myData.potions;
}
// D-pad
document.querySelectorAll('#dpad button').forEach(function(b){
  const v=b.dataset.d.split(',').map(Number);
  const on=function(e){e.preventDefault();keys.x=v[0];keys.y=v[1];};
  const off=function(e){e.preventDefault();keys.x=0;keys.y=0;};
  b.addEventListener('touchstart',on);b.addEventListener('touchend',off);b.addEventListener('mousedown',on);b.addEventListener('mouseup',off);
});
document.getElementById('bBasic').onclick=function(){socket&&socket.emit('act',{kind:'basic'});};
document.getElementById('bS1').onclick=function(){socket&&socket.emit('act',{kind:'s1'});};
document.getElementById('bS2').onclick=function(){socket&&socket.emit('act',{kind:'s2'});};
document.getElementById('bS3').onclick=function(){socket&&socket.emit('act',{kind:'s3'});};
document.getElementById('bLari').onclick=function(e){lari=!lari;e.target.classList.toggle('on',lari);};
document.getElementById('bAuto').onclick=function(e){auto=!auto;e.target.textContent=auto?'AUTO:ON':'AUTO:OFF';e.target.classList.toggle('on',auto);};
document.getElementById('mTas').onclick=function(){
  const n=(myData&&myData.potions)||0;
  popup('TAS','Potion: '+n+' (pulihkan 60 HP)',[{t:'Pakai Potion',f:function(){socket&&socket.emit('act',{kind:'tas'});hidePopup();}},{t:'Tutup',f:hidePopup}]);
};
document.getElementById('mChar').onclick=function(){
  if(!myData)return;
  popup('KARAKTER','Nama: '+myData.name+'<br>Class: '+myData.cls+'<br>Level: '+myData.level+'<br>Kills: '+myData.kills+' Deaths: '+myData.deaths);
};
document.getElementById('mSkill').onclick=function(){popup('SKILL','BASIC: serangan dasar<br>1: skill class (Dash/Frost/Triple)<br>2: Nova area<br>3: Heal +40 MP');};
document.getElementById('mKota').onclick=function(){popup('KOTA','Zona emas = aman + heal. Tekan RECALL untuk teleport (cooldown 30 dtk).',[{t:'RECALL',f:function(){socket&&socket.emit('recall');hidePopup();}},{t:'Tutup',f:hidePopup}]);};
document.getElementById('mHelp').onclick=function(){popup('BANTUAN','D-pad: gerak<br>BASIC/1/2/3: serang & skill<br>LARI: cepat, AUTO: serang otomatis<br>Ketuk nama pemain: tantang duel<br>Bunuh monster: XP + potion');};
document.getElementById('chatSend').onclick=function(){const i=document.getElementById('chatIn');if(i.value.trim())socket.emit('chat',{text:i.value});i.value='';};
// keyboard
addEventListener('keydown',function(e){
  const k=e.key.toLowerCase();
  if(k==='arrowup'||k==='w')keys.y=-1;else if(k==='arrowdown'||k==='s')keys.y=1;
  else if(k==='arrowleft'||k==='a')keys.x=-1;else if(k==='arrowright'||k==='d')keys.x=1;
  else if(k==='j')socket&&socket.emit('act',{kind:'basic'});
  else if(k==='k')socket&&socket.emit('act',{kind:'s1'});
  else if(k===' ')socket&&socket.emit('act',{kind:'basic'});
});
addEventListener('keyup',function(){keys.x=0;keys.y=0;});
function size(){c.width=c.clientWidth||window.innerWidth;c.height=Math.floor(window.innerHeight*0.38);}
addEventListener('resize',size);size();
// render
let camX=0,camY=0,shake=0;
function lerp(a,b,t){return a+(b-a)*t;}
function draw(){
  requestAnimationFrame(draw);
  const now=performance.now();
  const meP=players.get(me);
  if(meP){camX=lerp(camX,meP.x-c.width/2,0.12);camY=lerp(camY,meP.y-c.height/2,0.12);}
  ctx.save();
  if(shake>0){ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);shake*=0.9;if(shake<0.5)shake=0;}
  ctx.fillStyle='#14532d';ctx.fillRect(0,0,c.width,c.height);
  const ox=-camX,oy=-camY;
  // rumput
  ctx.fillStyle='rgba(0,0,0,0.12)';
  for(let i=0;i<60;i++){const gx=((i*173)%1600)+ox,gy=((i*311)%1200)+oy;ctx.fillRect(gx,gy,3,6);}
  if(world){
    // kota emas
    ctx.fillStyle='rgba(245,158,11,0.25)';ctx.fillRect(world.town.x+ox,world.town.y+oy,world.town.w,world.town.h);
    ctx.strokeStyle='#f59e0b';ctx.strokeRect(world.town.x+ox,world.town.y+oy,world.town.w,world.town.h);
    ctx.fillStyle='#f59e0b';ctx.font='bold 13px sans-serif';ctx.fillText('KOTA (aman+heal)',world.town.x+ox+8,world.town.y+oy+18);
    // danau
    ctx.fillStyle='#2563eb';ctx.beginPath();ctx.arc(world.pond.x+ox,world.pond.y+oy,world.pond.r,0,Math.PI*2);ctx.fill();
    // rumah
    world.houses.forEach(function(h){ctx.fillStyle='#78350f';ctx.fillRect(h.x+ox,h.y+oy,h.w,h.h);ctx.fillStyle='#451a03';ctx.fillRect(h.x+ox,h.y+oy+h.h-18,h.w,18);});
  }
  // proyektil
  projs.forEach(function(pr){ctx.fillStyle=pr.kind==='fire'?'#fb923c':'#fef3c7';ctx.beginPath();ctx.arc(pr.x+ox,pr.y+oy,pr.r+2,0,Math.PI*2);ctx.fill();});
  // monster
  monsters.forEach(function(m){
    ctx.fillStyle=m.alive?m.color:'#52525b';
    ctx.beginPath();ctx.arc(m.x+ox,m.y+oy,13,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#fff';ctx.font='bold 9px sans-serif';ctx.textAlign='center';ctx.fillText(m.kind,m.x+ox,m.y+oy-18);
    ctx.fillStyle='#27272a';ctx.fillRect(m.x+ox-16,m.y+oy-14,32,4);
    ctx.fillStyle='#ef4444';ctx.fillRect(m.x+ox-16,m.y+oy-14,32*(m.hp/m.maxHp),4);
  });
  // pemain
  players.forEach(function(p){
    const sx=p.x+ox,sy=p.y+oy;
    if(sx<-40||sx>c.width+40||sy<-40||sy>c.height+40)return;
    ctx.fillStyle=p.alive?p.color:'#52525b';
    ctx.beginPath();ctx.arc(sx,sy,14,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#fff';ctx.font='bold 13px sans-serif';ctx.textAlign='center';
    ctx.fillText({warrior:'W',mage:'M',archer:'A'}[p.cls]||'?',sx,sy+5);
    if(p.duelWith){ctx.strokeStyle='#ef4444';ctx.lineWidth=3;ctx.beginPath();ctx.arc(sx,sy,18,0,Math.PI*2);ctx.stroke();}
    ctx.fillStyle='rgba(0,0,0,0.65)';ctx.fillRect(sx-22,sy-34,44,12);
    ctx.fillStyle='#fff';ctx.font='9px sans-serif';ctx.fillText(p.name+' Lv'+p.level,sx,sy-25);
    ctx.fillStyle='#27272a';ctx.fillRect(sx-22,sy-21,44,4);
    ctx.fillStyle=p.hp>60?'#22c55e':p.hp>30?'#f59e0b':'#ef4444';ctx.fillRect(sx-22,sy-21,44*(p.hp/p.maxHp),4);
    ctx.fillStyle='#27272a';ctx.fillRect(sx-22,sy-16,44,3);
    ctx.fillStyle='#3b82f6';ctx.fillRect(sx-22,sy-16,44*(p.mp/p.maxMp),3);
  });
  // fx
  fxs=fxs.filter(function(f){return now-f.t<700;});
  fxs.forEach(function(f){
    const age=(now-f.t)/700;
    if(f.type==='explode'||f.type==='nova'||f.type==='frost'){
      ctx.strokeStyle='rgba(245,158,11,'+(1-age)+')';ctx.lineWidth=4;ctx.beginPath();ctx.arc(f.x+ox,f.y+oy,20+age*70,0,Math.PI*2);ctx.stroke();
    }else if(f.type==='heal'||f.type==='levelup'){
      ctx.fillStyle='rgba(74,222,128,'+(1-age)+')';ctx.font='bold 13px sans-serif';ctx.textAlign='center';
      ctx.fillText(f.type==='heal'?'+HP':'LEVEL UP',f.x+ox,f.y+oy-24*(1-age));
    }else if(f.type==='slash'){
      ctx.strokeStyle='rgba(245,158,11,'+(1-age)+')';ctx.lineWidth=3;ctx.beginPath();ctx.arc(f.x+ox,f.y+oy,14+age*10,-0.6,0.6);ctx.stroke();
    }else if(f.type==='hit'){
      ctx.fillStyle='rgba(255,255,255,'+(1-age)+')';ctx.beginPath();ctx.arc(f.x+ox,f.y+oy,6,0,Math.PI*2);ctx.fill();
    }
  });
  ctx.restore();
}
draw();
</script>
</body>
</html>
