<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Ukur Batas Kartu</title>
<style>
body{margin:0;background:#121212;color:#fff;font-family:system-ui,sans-serif;padding:16px 14px;font-size:14px;text-align:center}
.box{background:#1e1e1e;border-radius:10px;padding:14px;margin:8px 0}
.big{font-size:22px;font-weight:800;color:#1db954}
small{color:#aaa}
</style>
</head>
<body>
<div class="box"><b>Kartu Ukur</b><br><small>Kalau kartu ini tampil + angka muncul = pesan sebesar itu sampai utuh.</small><div class="big" id="rI">mengukur…</div><div id="rD"></div></div>
<script>
(function(){
var FILLER='__FILLER__';
try{
  var got=document.documentElement.outerHTML.length;
  document.getElementById('rI').textContent='diterima '+Math.round(got/1024)+' KB';
  document.getElementById('rD').textContent='filler '+Math.round(FILLER.length/1024)+' KB, ujung '+(FILLER.slice(-3)==='AAA'?'utuh':'TERPOTONG');
}catch(e){document.getElementById('rI').textContent='skrip mati: '+e.message;}
})();
</script>
</body>
</html>
