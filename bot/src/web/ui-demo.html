<style>
:root {
  --bg: #12141a;
  --card: #1e222d;
  --accent: #3b82f6;
  --ink: #ffffff;
  --muted: #94a3b8;
  --sys: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
}
* {
  margin: 0; padding: 0; box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  user-select: none; -webkit-user-select: none;
}
html, body {
  background: transparent; color: var(--ink);
  font-family: var(--sys); min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
.wrap {
  min-height: 100vh; display: flex;
  align-items: center; justify-content: center;
  padding: 16px 12px;
}
.card {
  position: relative; width: 100%; max-width: 330px;
  background: var(--card); border-radius: 18px;
  padding: 20px; border: 1px solid #334155;
  box-shadow: 0 16px 36px rgba(0,0,0,0.5);
  text-align: center;
}
.badge {
  display: inline-block; padding: 4px 10px;
  background: rgba(59, 130, 246, 0.15);
  color: var(--accent); border-radius: 20px;
  font-size: 11px; font-weight: 600;
  margin-bottom: 12px;
}
h1 { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
p { font-size: 13px; color: var(--muted); line-height: 1.5; margin-bottom: 18px; }
.counter-box {
  background: #0f172a; padding: 14px;
  border-radius: 12px; margin-bottom: 18px;
}
.counter-val { font-size: 28px; font-weight: 800; color: #10b981; }
.btn {
  width: 100%; padding: 12px;
  background: var(--accent); color: #fff;
  border: none; border-radius: 10px;
  font-size: 14px; font-weight: 700; cursor: pointer;
  transition: transform 0.1s ease;
}
.btn:active { transform: scale(0.96); background: #2563eb; }
</style>

<div class="wrap">
  <div class="card">
    <div class="badge">AZUSAMD WEBUI PONDASI</div>
    <h1>Custom UI Anda</h1>
    <p>Silakan modifikasi kode HTML, CSS, dan JavaScript di file ini untuk membuat game, formulir, atau pemutar media Anda sendiri!</p>
    
    <div class="counter-box">
      <div style="font-size: 11px; color: var(--muted); margin-bottom: 4px;">INTERAKSI KLIK:</div>
      <div class="counter-val" id="cnt">0</div>
    </div>

    <button class="btn" id="btn-click">✨ KLIK TOMBOL</button>
  </div>
</div>

<script>
(function() {
  var count = 0;
  var btn = document.getElementById('btn-click');
  var cnt = document.getElementById('cnt');

  btn.onclick = function() {
    count++;
    cnt.innerText = count;
  };
})();
</script>
