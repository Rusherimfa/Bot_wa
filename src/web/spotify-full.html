<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Spotify Player Full</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
body{margin:0;color:#fff;font-family:system-ui,sans-serif;text-align:center;padding:20px 14px 18px;background:#0b0f0d}
#wrap{position:relative;overflow:hidden;border-radius:20px;box-shadow:0 12px 40px rgba(0,0,0,.65),0 0 0 1px rgba(255,255,255,.08)}
#bgwrap{position:absolute;inset:0;background:#000}
#bgwrap img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity 1.2s ease;animation:kb 14s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.12)}}
#bgshade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.45) 0%,rgba(0,0,0,.25) 35%,rgba(0,0,0,.9) 100%)}
#content{position:relative;padding:16px 14px 14px}
#cover{width:240px;max-width:72vw;aspect-ratio:16/9;border-radius:12px;object-fit:cover;display:block;margin:4px auto;background:linear-gradient(135deg,#1db954,#191414);box-shadow:0 4px 16px rgba(0,0,0,.6)}
#coverfb{display:none;width:240px;max-width:72vw;aspect-ratio:16/9;border-radius:12px;margin:4px auto;align-items:center;justify-content:center;background:linear-gradient(135deg,#1db954 0%,#0f3d22 60%,#191414 100%)}
h2{margin:12px 0 2px;font-size:20px;text-shadow:0 2px 8px rgba(0,0,0,.8)}
.artist{color:#ddd;font-size:14px;margin-bottom:6px;text-shadow:0 1px 6px rgba(0,0,0,.8)}
.tag{display:inline-block;background:#1db954;color:#04120a;font-size:10px;font-weight:800;letter-spacing:1px;border-radius:10px;padding:3px 10px}
#viz{display:block;margin:10px auto 0;width:280px;max-width:82vw;height:46px}
#barwrap{background:rgba(255,255,255,.2);border-radius:6px;height:10px;margin:10px 4px 4px;position:relative;overflow:hidden;cursor:pointer}
#bar{background:linear-gradient(90deg,#1ed760,#1db954);border-radius:6px;height:10px;width:0%}
#times{display:flex;justify-content:space-between;font-size:12px;color:#ccc}
#controls{display:flex;align-items:center;justify-content:center;gap:18px;margin-top:6px}
.skip{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.14);border:0;display:flex;align-items:center;justify-content:center;padding:0}
#play{width:78px;height:78px;border-radius:50%;background:linear-gradient(180deg,#1ed760,#1db954);border:0;display:flex;align-items:center;justify-content:center;padding:0;box-shadow:0 6px 24px rgba(29,185,84,.45)}
#play:disabled{background:#535353;box-shadow:none}
#play svg,.skip svg{display:block}
.spin{animation:rot 1s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
#status{font-size:11px;color:#aaa;min-height:14px;margin-top:8px}
#err{font-size:12px;color:#ff8080;min-height:16px;margin-top:6px}
#dbg{font-size:10px;color:#777;margin-top:4px}
.hint{font-size:11px;color:#999;margin-top:2px}
</style>
</head>
<body>
<div id="wrap">
  <div id="bgwrap">
    <img id="bgA" src="" alt="">
    <img id="bgB" src="" alt="" style="opacity:0">
    <img id="bgC" src="" alt="" style="opacity:0">
    <div id="bgshade"></div>
  </div>
  <div id="content">
    <img id="cover" src="data:image/jpeg;base64,__COVER_B64__" alt="cover">
    <div id="coverfb"><svg width="52" height="52" viewBox="0 0 24 24" fill="rgba(0,0,0,.75)"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg></div>
    <h2>__TITLE__</h2>
    <div class="artist">__ARTIST__</div>
    <span class="tag">__TAG__</span>
    <canvas id="viz" width="280" height="46"></canvas>
    <div id="barwrap"><div id="bar"></div></div>
    <div id="times"><span id="cur">0:00</span><span id="dur">0:00</span></div>
    <div id="controls">
      <button class="skip" id="back"><svg width="26" height="26" viewBox="0 0 24 24" fill="#fff"><path d="M11 18V6l-8.5 6L11 18zm.5-6l8.5 6V6l-8.5 6z"/></svg></button>
      <button id="play"></button>
      <button class="skip" id="fwd"><svg width="26" height="26" viewBox="0 0 24 24" fill="#fff"><path d="M4 18l8.5-6L4 6v12zm9-12v12l8.5-6L13 6z"/></svg></button>
    </div>
    <div id="status">Ketuk play</div>
    <div id="err"></div>
    <div id="dbg"></div>
    <div class="hint">Ketuk bar untuk lompat</div>
  </div>
</div>
<script>
(function(){
var PARTS=__PARTS__;
var DURS=__DURS__;
var TOTAL=__TOTAL__;
var COVERB64='__COVER_B64__';
var ICON_PLAY='<svg width="34" height="34" viewBox="0 0 24 24" fill="#04120a"><path d="M8 5v14l11-7z"/></svg>';
var ICON_PAUSE='<svg width="34" height="34" viewBox="0 0 24 24" fill="#04120a"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>';
var ICON_LOAD='<svg class="spin" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#04120a" stroke-width="3"><path d="M12 3a9 9 0 1 0 9 9"/></svg>';
var ICON_ERR='<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#04120a" stroke-width="3"><path d="M6 6l12 12M18 6L6 18"/></svg>';
var STILLS=__STILLS__;
var btn=document.getElementById('play'),bar=document.getElementById('bar'),
    barwrap=document.getElementById('barwrap'),
    cur=document.getElementById('cur'),durEl=document.getElementById('dur'),
    err=document.getElementById('err'),status=document.getElementById('status'),
    viz=document.getElementById('viz'),
    bgs=[document.getElementById('bgA'),document.getElementById('bgB'),document.getElementById('bgC')],
    cover=document.getElementById('cover'),coverfb=document.getElementById('coverfb');
btn.innerHTML=ICON_PLAY;
durEl.textContent=fmt(TOTAL);
try{document.getElementById('dbg').textContent='dbg n:'+PARTS.length+' tot:'+fmt(TOTAL);}catch(e){}
function fmt(s){if(!isFinite(s)||s<0)s=0;s=Math.floor(s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
function setStatus(t){status.textContent=t;}
function fail(m){btn.disabled=true;btn.innerHTML=ICON_ERR;setStatus('Gagal.');err.textContent=m||'Audio kartu gagal. Pakai !spotifydl untuk full song.';}
function coverCheck(){
  var ok=false;
  try{ok=cover.complete&&cover.naturalWidth>0;}catch(e){ok=false;}
  if(ok){cover.style.display='block';coverfb.style.display='none';}
  else{cover.style.display='none';coverfb.style.display='flex';}
}
cover.addEventListener('load',coverCheck);
cover.addEventListener('error',coverCheck);
setTimeout(coverCheck,2500);
// Slideshow sinematik (sama seperti kartu preview).
var si=0;
(function initBg(){
  try{
    if(STILLS&&STILLS.length){
      for(var k=0;k<3;k++){if(bgs[k]&&STILLS[k%STILLS.length])bgs[k].src='data:image/jpeg;base64,'+STILLS[k%STILLS.length];}
      (function show(i){try{for(var k=0;k<3;k++){if(bgs[k])bgs[k].style.opacity=(k===(i%3))?1:0;}}catch(e){}})(0);
      setInterval(function(){si=(si+1)%STILLS.length;
        try{for(var k=0;k<3;k++){if(bgs[k])bgs[k].style.opacity=(k===(si%3))?1:0;}}catch(e){}
      },4000);
    }else if(COVERB64&&COVERB64.indexOf('__COVER')!==0){
      bgs[0].src='data:image/jpeg;base64,'+COVERB64;
    }
  }catch(e){}
})();
var vc=viz.getContext('2d');
function drawIdle(){vc.clearRect(0,0,280,46);vc.fillStyle='rgba(255,255,255,.25)';for(var i=0;i<32;i++)vc.fillRect(i*8+2,21,5,4);}
drawIdle();
var analyser=null,freq=null;
function drawLive(){
  if(!analyser)return;
  analyser.getByteFrequencyData(freq);
  vc.clearRect(0,0,280,46);
  for(var i=0;i<32;i++){var v=freq[i]/255,h=Math.max(3,v*44);vc.fillStyle=v>0.7?'#1ed760':'#1db954';vc.fillRect(i*8+2,46-h,5,h);}
}
var AC=window.AudioContext||window.webkitAudioContext;
if(!AC||!PARTS||!PARTS.length){fail(!AC?'Perangkat tidak mendukung audio kartu. Pakai !spotifydl.':null);return;}
var ctx=null,bufs={},src=null,timer=null,playing=false;
var pi=0,off0=0,t0=0,globalOff=0,playToken=0;
try{ctx=new AC({sampleRate:24000});}catch(e){try{ctx=new AC();}catch(e2){}}
if(!ctx){fail('Perangkat tidak mendukung audio kartu. Pakai !spotifydl.');return;}
try{analyser=ctx.createAnalyser();analyser.fftSize=64;freq=new Uint8Array(analyser.frequencyBinCount);}catch(e){analyser=null;}
function b64ToBuf(b64){var bin=atob(b64),n=bin.length,u8=new Uint8Array(n);for(var i=0;i<n;i++)u8[i]=bin.charCodeAt(i);return u8.buffer;}
function baseOf(i){var s=0;for(var k=0;k<i&&k<DURS.length;k++)s+=DURS[k];return s;}
function localPos(){
  if(!playing)return 0;
  var bd=bufs[pi]?bufs[pi].duration:DURS[pi];
  return Math.min(off0+(ctx.currentTime-t0),bd);
}
function globalPos(){
  if(!playing)return globalOff;
  return Math.min(baseOf(pi)+localPos(),TOTAL);
}
function paint(){var p=globalPos();bar.style.width=(100*p/TOTAL)+'%';cur.textContent=fmt(p);}
function tick(){
  paint();drawLive();
  if(globalPos()>=TOTAL-0.3){finishAll();}
}
function finishAll(){stopSrc();globalOff=0;bar.style.width='0%';cur.textContent='0:00';drawIdle();btn.innerHTML=ICON_PLAY;setStatus('Selesai.');}
function stopSrc(){playing=false;if(timer){clearInterval(timer);timer=null;}if(src){try{src.onended=null;src.stop();}catch(e){}src=null;}}
function decodePart(i,ok,no,silent){
  if(bufs[i]){ok(bufs[i]);return;}
  if(!silent)setStatus('Memuat bagian '+(i+1)+'/'+DURS.length+'…');
  try{
    var pr=ctx.decodeAudioData(b64ToBuf(PARTS[i]),
      function(b){bufs[i]=b;ok(b);},
      function(){if(no)no();});
    if(pr&&pr.then)pr.then(function(b){bufs[i]=b;ok(b);},function(){if(no)no();});
  }catch(e){if(no)no();}
}
function prefetch(i){
  if(i<0||i>=PARTS.length||bufs[i])return;
  decodePart(i,function(){for(var k in bufs){if(+k!==i&&+k!==pi){try{delete bufs[k];}catch(e){bufs[k]=null;}}}},null,true);
}
function playSrc(i,local){
  stopSrc();
  try{
    if(ctx.state==='suspended'){var r=ctx.resume();if(r&&r.catch)r.catch(function(){});}
    src=ctx.createBufferSource();src.buffer=bufs[i];
    if(analyser){src.connect(analyser);analyser.connect(ctx.destination);}
    else src.connect(ctx.destination);
    src.onended=function(){if(playing)advance(i);};
    pi=i;off0=local;t0=ctx.currentTime;
    src.start(0,local);
    playing=true;btn.innerHTML=ICON_PAUSE;
    setStatus('Memutar (bagian '+(i+1)+'/'+DURS.length+').');err.textContent='';
    timer=setInterval(tick,250);
    prefetch(i+1);
  }catch(e){fail('Gagal mulai. Pakai !spotifydl.');}
}
function playAt(g){
  g=Math.max(0,Math.min(TOTAL-0.2,g));
  var i=0;while(i<DURS.length-1&&g>=baseOf(i)+DURS[i])i++;
  var local=Math.max(0,Math.min(DURS[i]-0.2,g-baseOf(i)));
  stopSrc();
  var my=++playToken;
  setStatus('Memuat…');err.textContent='';
  decodePart(i,function(){
    if(my!==playToken)return;
    for(var k in bufs){if(+k!==i&&+k!==i+1){try{delete bufs[k];}catch(e){bufs[k]=null;}}}
    playSrc(i,local);
  },function(){if(my===playToken)fail('Audio rusak di bagian '+(i+1)+'. Pakai !spotifydl.');});
}
function advance(i){
  var nx=i+1;
  if(nx>=DURS.length){finishAll();return;}
  if(timer){clearInterval(timer);timer=null;}
  src=null;
  playAt(baseOf(nx)+0.01);
}
function seekTo(g){
  if(!PARTS.length)return;
  g=Math.max(0,Math.min(TOTAL-0.2,g));
  var was=playing;playToken++;stopSrc();
  if(was)playAt(g);else{globalOff=g;paint();setStatus('Siap.');}
}
btn.onclick=function(){
  if(!PARTS.length)return;
  if(playing){globalOff=globalPos();playToken++;stopSrc();drawIdle();btn.innerHTML=ICON_PLAY;setStatus('Jeda.');}
  else playAt(globalOff);
};
document.getElementById('back').onclick=function(){seekTo(globalPos()-10);};
document.getElementById('fwd').onclick=function(){seekTo(globalPos()+10);};
barwrap.addEventListener('click',function(e){
  var r=barwrap.getBoundingClientRect();
  var x=(e.clientX!=null?e.clientX:(e.touches&&e.touches[0]?e.touches[0].clientX:r.left));
  seekTo(((x-r.left)/r.width)*TOTAL);
});
paint();
})();
</script>
</body>
</html>
